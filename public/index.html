:root[data-theme="heritage"] .ctip{border-color:var(--line-2)}
.ctip b{display:block;font-size:12.5px;margin-bottom:3px}
.ctip-row{display:flex;justify-content:space-between;gap:14px;align-items:center}
.ctip-row>span:first-child{color:var(--ink-3)}
.chart-wrap{position:relative}
.chart .xhair{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
.chart .hdot{fill:var(--surface);stroke:var(--accent);stroke-width:2.5;pointer-events:none}
.chart .bar-hit{cursor:pointer;fill:transparent}
.chart .bar-col{fill:color-mix(in srgb,var(--ink) 5%,transparent);opacity:0;transition:opacity .12s ease;pointer-events:none}
.chart .bar-grp:hover .bar-col,.chart .bar-grp.is-act .bar-col{opacity:1}
.chart .bar-grp:hover rect.bar-v,.chart .bar-grp.is-act rect.bar-v{filter:brightness(1.08)}
.donut circle.seg{transition:stroke-width .14s ease,opacity .14s ease;cursor:pointer}
.donut.has-hl circle.seg:not(.is-hl){opacity:.3}
.donut circle.seg.is-hl{stroke-width:23}
.dlist li[data-idx]{cursor:pointer;border-radius:6px;padding:6px 6px;margin:0 -6px;transition:background-color .12s ease}
.dlist li[data-idx]:hover,.dlist li.is-hl{background:var(--surface-2)}
.seg-sm{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg-sm button{border:0;background:transparent;color:var(--ink-2);padding:3px 9px;border-radius:7px;font:600 11.5px var(--font);cursor:pointer;white-space:nowrap}
.seg-sm button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{position:relative}
.bar .pace-mk{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink);opacity:.65;z-index:2;pointer-events:none}
.seg3{grid-template-columns:repeat(3,1fr)}
.sim-box{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.range{width:100%;accent-color:var(--accent);cursor:pointer;height:6px}
.cf-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cf-toolbar .txn-search{flex:1;min-width:190px;position:relative;display:flex;align-items:center}
.cf-toolbar .txn-search svg{position:absolute;left:10px;width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.cf-toolbar .txn-search input{padding:7px 30px 7px 32px;font-size:13px;border-radius:10px}
.cf-toolbar .txn-clr{position:absolute;right:5px;border:0;background:transparent;color:var(--ink-3);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.cf-toolbar .txn-clr svg{position:static;width:13px;height:13px}
.drift-list{display:grid;gap:11px;margin-top:6px}
.drift-row{display:grid;grid-template-columns:minmax(96px,136px) 1fr auto;gap:12px;align-items:center;font-size:12.5px}
.drift-trk{position:relative;height:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
.drift-fill{height:100%;border-radius:99px;min-width:2px}
.drift-tgt{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--ink);border-radius:2px}
.rec-sec{margin-bottom:14px}.rec-sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.rec-row{display:grid;grid-template-columns:minmax(0,1fr) 136px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rec-row:last-child{border-bottom:0}
.rule-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rule-row:last-child{border-bottom:0}
.mhead-btn.is-on,.iconbtn.is-on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.cat-link{cursor:pointer;border-radius:8px;padding:4px 6px;margin:-4px -6px 6px!important;transition:background-color .12s ease}
.cat-link:hover{background:var(--surface-2)}
.nw-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-2)}
.nw-stats span b{color:var(--ink);font-weight:600}
@media (max-width:640px){.drift-row{grid-template-columns:minmax(78px,112px) 1fr auto;gap:8px;font-size:12px}.rec-row{grid-template-columns:minmax(0,1fr) 114px;gap:8px}.nw-stats{gap:6px 12px}}
.an-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.an-kpi{display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.wk-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:146px;padding-top:16px}
.wk-col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wk-bar{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--accent);min-height:4px;transition:height .2s ease}
.wk-bar.hi{background:var(--c5)}
.wk-lbl{font-size:11px;color:var(--ink-3);font-weight:600}
.wk-val{font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.pillar-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pillar{display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.boost-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.boost-row:last-child{border-bottom:0}
.boost-row:hover b{color:var(--accent)}
@media (max-width:1120px) and (min-width:1024px) and (orientation:landscape){.pillar-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.an-kpis{grid-template-columns:1fr 1fr;gap:10px}.an-kpi .mid{font-size:18px;white-space:nowrap}.pillar-grid{grid-template-columns:1fr}}
:root[data-theme="heritage"] .wk-bar{border-radius:2px 2px 0 0}
.loan-card{border:1px solid var(--line);border-radius:16px;background:var(--surface-2);padding:15px 16px;display:grid;gap:12px}
.loan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.loan-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.loan-kpi{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-radius:11px;padding:9px 11px;min-width:0}
.loan-kpi span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.loan-kpi b{display:block;font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.loan-kpi small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.emi-sch{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px}
.emi-sch .tbl{min-width:540px}
.emi-sch .tbl th,.emi-sch .tbl td{padding:7px 9px;font-size:12px}
.stmt-drop{border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:14px;background:var(--surface-2);padding:16px;text-align:center;display:grid;gap:8px;justify-items:center}
.stmt-drop>svg{width:28px;height:28px;color:var(--accent)}
.stmt-list{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.stmt-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12.5px}
.stmt-row:last-child{border-bottom:0}
.stmt-row.dup{opacity:.62}
.stmt-ctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.stmt-ctrls select{font:inherit;font-size:11.5px;padding:3px 6px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
@media (max-width:740px){.loan-kpis{grid-template-columns:1fr 1fr}}
/* Unified project-wide number font & automatic per-tile scaling */
:is(.big,.mid,.mono,.kv dd,.in.num,.res div b,.amt span,.amt input,.donut .dn-v,.gauge .gv,.mob-item-r .val,.mob-ring-v,.loan-kpi b,.txn-amt,.chart .endlab,.chart .ax){font-family:var(--font);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.015em}
.ov-nw,.kpi5>.card,.an-kpis>.card,.stat3>div,.loan-kpis>.loan-kpi,.res>div{container-type:inline-size}
.ov-nw .big{font-size:clamp(26px,9.2cqi,44px);white-space:nowrap}

.an-kpi .mid{font-size:clamp(14.5px,11cqi,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat3 .mid{font-size:clamp(13px,11cqi,21px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loan-kpi b{font-size:clamp(13.5px,9.5cqi,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res div b{font-size:clamp(14px,9.5cqi,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- derived numbers ---------- */
function inr(v,c){return v*(c==='INR'?1:(S.fx[c]||1))}
/* balance in account terms: card = dues owed, others = money held */
function accBal(a){
  var b=a.open||0;
  S.flows.forEach(function(f){
    if(f.type==='trf'){
      if(f.acc===a.id)b+=(a.type==='card'?f.amt:-f.amt);
      if(f.toAcc===a.id)b+=(a.type==='card'?-f.amt:f.amt);
      return;
    }
    if(f.acc!==a.id)return;
    if(a.type==='card')b+=(f.type==='exp'?f.amt:-f.amt);
    else b+=(f.type==='inc'?f.amt:-f.amt);
  });
  return b;
}
function accSigned(a){var b=accBal(a);return a.type==='card'?-b:b}
function calcEMI(P,ratePct,months){
  if(!(P>0&&months>0))return 0;
  var r=(ratePct||0)/1200;
  if(r<=0)return Math.round(P/months);
  var f=Math.pow(1+r,months);
  return Math.round(P*r*f/(f-1));
}
function addMonthsISO(iso,mAdd){
  if(!iso||iso.length<10)return '';
  var p=iso.split('-').map(Number), d=new Date(p[0],p[1]-1+mAdd,1);
  var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(Math.min(p[2]||1,last));
}
function liabCalc(l){
  var r=(l.rate||0)/1200, P=l.val, E=l.emi||0, n=null, totalInt=null;
  if(P<=0){n=0;totalInt=0}
  else if(E>0){
    if(r===0){n=P/E;totalInt=0}
    else if(E>P*r){n=-Math.log(1-P*r/E)/Math.log(1+r);totalInt=Math.max(0,n*E-P)}
  }
  return {months:n==null?null:Math.ceil(n),exactM:n,interest:totalInt};
}
function liabStatus(l){
  var P=Math.max(0,l.val||0), r=(l.rate||0)/1200, paidM=Math.max(0,Math.round(l.paid||0)), totalM=Math.max(0,Math.round(l.tenure||0));
  var c=liabCalc(l), remTenure=totalM>0?Math.max(0,totalM-paidM):null;
  var effEmi=P<=0?0:((l.emi||0)>0?l.emi:(remTenure>0?calcEMI(P,l.rate||0,remTenure):0));
  var nextInt=P>0?Math.round(P*r):0;
  var firstPay=P<=0?0:(effEmi>0?Math.min(P+nextInt,effEmi):0);
  var nextPrin=Math.max(0,Math.min(P,firstPay-nextInt));
  var pending=P<=0?0:(c.months!=null?c.months:remTenure);
  if(remTenure!=null&&c.months!=null)pending=Math.min(remTenure,c.months);
  var nextDue=l.start?addMonthsISO(l.start,paidM):'';
  return {paidM:paidM,totalM:totalM,pending:pending,effEmi:effEmi,nextInt:nextInt,nextPrin:nextPrin,nextDue:nextDue,interest:c.interest,estM:c.months};
}
function liabSchedule(l,maxRows){
  var st=liabStatus(l), b=Math.max(0,l.val||0), r=(l.rate||0)/1200, emi=st.effEmi, rows=[];
  if(b<=0||!(emi>0))return rows;
  var lim=maxRows||360, startIdx=st.paidM+1, i=0;
  while(b>0.5&&i<lim){
    var intr=b*r;
    if(emi<=intr&&r>0)break;
    var pay=Math.min(b+intr,emi), prin=Math.max(0,pay-intr), close=Math.max(0,b-prin);
    rows.push({num:startIdx+i,date:l.start?addMonthsISO(l.start,st.paidM+i):'',open:Math.round(b),emi:Math.round(pay),prin:Math.round(prin),intr:Math.round(intr),close:Math.round(close)});
    b=close; i++;
  }
  return rows;
}
function liabOneExtra(l){
  var st=liabStatus(l), b0=Math.max(0,l.val||0), r=(l.rate||0)/1200, emi=st.effEmi;
  if(b0<=0||!(emi>0))return null;
  function runSim(extraPerYr){
    var b=b0, m=0, totI=0;
    while(b>0.5&&m<480){
      m++;
      var ii=b*r;
      if(emi<=ii&&r>0)return null;
      totI+=ii;
      var pay=emi+(extraPerYr>0&&m%12===0?extraPerYr:0);
      var realPay=Math.min(b+ii,pay);
      b=Math.max(0,b-(realPay-ii));
    }
    return {m:m,intr:Math.round(totI)};
  }
  var base=runSim(0), fast=runSim(emi);
  if(!base||!fast)return null;
  return {savedM:Math.max(0,base.m-fast.m),savedInt:Math.max(0,base.intr-fast.intr),extra:Math.round(emi)};
}
function prepaySim(extra){
  var active=S.liabs.filter(function(l){return l.val>0&&(l.emi||0)>0}).map(function(l){
    return {b:l.val,emi:l.emi||0,r:(l.rate||0)/1200,rate:l.rate||0};
  });
  if(!active.length)return null;
  function sim(ext){
    var ls=active.map(function(x){return {b:x.b,emi:x.emi,r:x.r,rate:x.rate}}).sort(function(a,b){return b.rate-a.rate});
    var m=0, intPaid=0;
    while(m<600){
      var rem=ls.filter(function(x){return x.b>0.5});
      if(!rem.length)break;
      m++;
      var pool=ext;
      rem.forEach(function(x){
        var ii=x.b*x.r;
        intPaid+=ii;
        x.b+=ii;
        var pay=Math.min(x.b,x.emi);
        x.b-=pay;
        if(x.b<=0.5){pool+=(x.emi-pay);x.b=0}
      });
      if(pool>0){
        for(var j=0;j<rem.length&&pool>0;j++){
          if(rem[j].b<=0)continue;
          var p2=Math.min(rem[j].b,pool);
          rem[j].b-=p2; pool-=p2;
          if(rem[j].b<=0.5)rem[j].b=0;
        }
      }
      if(m===1&&rem.some(function(x){return x.b>active[0].b*1.5})&&ext===0)break;
    }
    var stuck=ls.some(function(x){return x.b>1});
    return stuck?null:{months:m,interest:intPaid};
  }
  var base=sim(0), fast=sim(Math.max(0,extra||0));
  if(!base||!fast)return null;
  return {baseM:base.months,baseInt:base.interest,fastM:fast.months,fastInt:fast.interest,savedM:Math.max(0,base.months-fast.months),savedInt:Math.max(0,base.interest-fast.interest)};
}
function hasPortfolioData(){return S.assets.length>0||S.accounts.length>0||S.liabs.length>0||S.lent.length>0}
function syncAutoSnapshots(){
  if(S.examples||!S.prefs||S.prefs.autoSnap===false||!hasPortfolioData())return false;
  var cur=monthKey(today()), dToday=today(), t=totals(), changed=false;
  var sorted=sortedSnaps();
  if(sorted.length){
    var last=sorted[sorted.length-1], lm=monthKey(last.d), iter=0;
    while(lm<cur&&iter<12){
      iter++; lm=shiftMonth(lm,1);
      if(lm>=cur)break;
      if(!S.snaps.some(function(s){return monthKey(s.d)===lm})){
        S.snaps.push({id:uid(),d:lm+'-'+pad(daysInMonth(lm)),a:last.a,l:last.l,auto:1});
        changed=true;
      }
    }
  }
  var curAuto=null, sameDay=null;
  S.snaps.forEach(function(s){
    if(monthKey(s.d)===cur&&s.auto)curAuto=s;
    if(s.d===dToday)sameDay=s;
  });
  if(curAuto){
    if(curAuto.d!==dToday||Math.round(curAuto.a)!==Math.round(t.a)||Math.round(curAuto.l)!==Math.round(t.l)){
      curAuto.d=dToday;curAuto.a=t.a;curAuto.l=t.l;changed=true;
    }
  }else if(sameDay){
    if(Math.round(sameDay.a)!==Math.round(t.a)||Math.round(sameDay.l)!==Math.round(t.l)){
      sameDay.a=t.a;sameDay.l=t.l;sameDay.auto=1;changed=true;
    }
  }else{
    S.snaps.push({id:uid(),d:dToday,a:t.a,l:t.l,auto:1});
    changed=true;
  }
  return changed;
}
function processRecurring(){
  if(S.examples||!S.recur||!S.recur.length)return 0;
  var cur=monthKey(today()), dToday=today(), floor=shiftMonth(cur,-5), added=0;
  S.recur.forEach(function(r){
    if(r.active===false||!(r.amt>0))return;
    var m=r.lastRun?shiftMonth(r.lastRun,1):cur;
    if(m<floor)m=floor;
    var iter=0;
    while(m<=cur&&iter<12){
      iter++;
      var day=Math.max(1,Math.min(Math.round(r.day||1),daysInMonth(m)));
      var dt=m+'-'+pad(day);
      if(dt>dToday)break;
      var dup=S.flows.some(function(f){return f.recId===r.id&&monthKey(f.d)===m});
      if(!dup){
        S.flows.push({id:uid(),d:dt,type:r.type||'exp',cat:r.cat||(r.type==='trf'?'Transfer':'Other'),note:r.note||'',amt:r.amt,acc:r.acc||'',toAcc:r.toAcc||'',recId:r.id});
        added++;
      }
      r.lastRun=m;
      m=shiftMonth(m,1);
    }
  });
  return added;
}

    kind='txn';

    var toA=preset?accOf(preset):S.accounts.filter(function(a){return !fromA||a.id!==fromA.id})[0];
    var cardDues=toA&&toA.type==='card'?Math.max(0,accBal(toA)):0;
    d={type:'trf',amt:cardDues>0?String(Math.round(cardDues)):'',cat:'Transfer',dateMode:'today',date:today(),acc:fromA?fromA.id:'',toAcc:toA?toA.id:'',note:toA&&toA.type==='card'?'Card bill payment':'',recOn:false,recDay:'1'};
  }else if(kind==='txn'){
    d={type:'exp',amt:'',cat:'',dateMode:'today',date:today(),acc:preset||defaultAccId(),toAcc:'',note:'',recOn:false,recDay:String(Math.min(28,new Date().getDate()))};
  }
  if(kind==='recur'){
    d={type:'exp',amt:'',cat:'',acc:defaultAccId(),toAcc:'',day:String(Math.min(28,new Date().getDate())),note:''};
  }
  if(kind==='stmt'){
    d={mode:'file',sms:'',acc:defaultAccId(),keepBal:false,rows:[],fname:'',info:'',needPw:false,pw:'',busy:false,rawBuf:null};
  }
  if(kind==='reconcile'){
    d={a:{},c:{}};
    S.assets.forEach(function(a){d.a[a.id]=String(a.val||0)});
    S.accounts.forEach(function(a){d.c[a.id]=String(Math.round(accBal(a)))});
  }
  if(kind==='asset')d={cls:'',name:'',cur:'INR',inv:'',val:'',bd:''};
  if(kind==='lent')d={name:'',princ:'',rate:'',dateMode:'today',date:today(),recv:'0',acc:defaultAccId()};
  if(kind==='pay')d={id:preset||'',amt:'',acc:defaultAccId()};
  if(kind==='liab')d={type:'',name:'',orig:'',val:'',emi:'',rate:'',start:today(),tenure:'',paid:'0',acc:defaultAccId(),creditDisb:false};
  if(kind==='payemi'){
    var l0=S.liabs.filter(function(x){return x.id===preset})[0];
    if(!l0)return;
    var st0=liabStatus(l0), defAcc=(l0.acc&&accOf(l0.acc)?l0.acc:defaultAccId());
    d={id:l0.id,amt:String(Math.round(st0.effEmi||0)),acc:defAcc,date:today(),note:'EMI #'+(st0.paidM+1)+' · '+l0.name,countEmi:'1',recOn:false};
  }
  if(kind==='budget'){
    var sug=preset?Math.ceil((monthStats(ui.month||focusMonth()).cats[preset]||0)/500)*500:0;
    d={cat:preset||'',limit:sug>0?String(sug):''};
  }
  if(kind==='acct')d={type:'',provider:'',nick:'',last4:'',bal:''};
  if(kind==='goal')d={name:'',today:'',years:'10',infl:'6',ret:'11',saved:'0',links:{}};
  if(kind==='cmd')d={q:'',idx:0};
  if(kind==='del'){var lst=LISTOF[preset], rec=S[lst].filter(function(x){return x.id===edit})[0];d={k:preset,list:lst,id:edit,label:rec?(rec.name||rec.cat||accName(rec)||'this entry'):'this entry'}}
  else if(edit){
    var r0=S[LISTOF[kind]].filter(function(x){return x.id===edit})[0];
    if(!r0)return;
    if(kind==='asset'){d={cls:r0.cls,name:r0.name,cur:r0.cur,inv:r0.inv>0?String(r0.inv):'',val:String(r0.val),bd:r0.bd||''};step=2}
    else if(kind==='liab'){d={type:r0.type||'oth',name:r0.name,orig:r0.orig>0?String(r0.orig):String(r0.val),val:String(r0.val),emi:String(r0.emi||0),rate:r0.rate>0?String(r0.rate):'',start:r0.start||'',tenure:r0.tenure>0?String(r0.tenure):'',paid:String(r0.paid||0),acc:r0.acc||'',creditDisb:false};step=2}
    else if(kind==='acct'){d={type:r0.type,provider:r0.provider||'',nick:r0.nick||'',last4:r0.last4||'',bal:String(r0.open||0)};step=2}

  }

}

  });
}

/* ---------- saving ---------- */
function commit(skipAuto){
  if(!skipAuto)syncAutoSnapshots();
  try{localStorage.setItem('kb-ts',String(Date.now()))}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(remoteDoc){setStatus('Saving…');clearTimeout(saveT);saveT=setTimeout(flush,700)}
  else setStatus('Saved in this browser only');
}
function flush(){
  if(!remoteDoc)return;
  if(flushing){clearTimeout(saveT);saveT=setTimeout(flush,400);return}
  flushing=true;
  remoteDoc.set({v:1,s:JSON.parse(JSON.stringify(S))}).then(function(){setStatus('Saved to your Google Drive')},function(e){
    var exp=e&&e.message==='Sign-in expired';
    if(exp){remoteDoc=null;g.token='';g.exp=0;gSaveSess()}
    setStatus(exp?'Saved locally · Tap Reconnect to sync Drive':'Saved in this browser. Drive sync needs sign-in');
    var ae=document.activeElement;
    if(exp&&(!ae||!ae.matches||!ae.matches('input,select,textarea')))render();
  }).then(function(){flushing=false});
}
function update(skipAuto){
  commit(skipAuto);
  setTimeout(function(){
    var a=document.activeElement, fid=a&&a.dataset?a.dataset.fid:null;
    render();
    if(fid){var el=app.querySelector('[data-fid="'+CSS.escape(fid)+'"]');if(el)el.focus()}
  },0);
}

  }else h+='<p class="muted sm" style="margin-bottom:10px" role="status">'+esc(gDriveHint())+'</p>'+gButton();
  return h+'</div></div>';
}
function gIcon(){return '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>'}
function driveSide(inSheet){
  if(g.state==='off'||g.state==='loading')return '';
  var rail=!inSheet&&ui.collapsed, aIn=inSheet?'data-sa="menu-g-in"':'data-act="g-in"', aOut=inSheet?'data-sa="menu-g-out"':'data-act="g-out"';
  if(g.state==='in'){
    var em=g.email||'Google account', ini=(em[0]||'G').toUpperCase(), exp=!gTokenValid();
    var rec=exp?(rail?'<button type="button" class="toggle" '+aIn+' aria-label="Reconnect Google Drive" title="Reconnect Google Drive" style="margin:4px auto 0;color:var(--warn);border-color:var(--warn)">'+ic('undo')+'</button>':'<button type="button" class="btn ghost sm" style="width:100%;justify-content:center;margin-top:6px" '+aIn+'>Reconnect Drive</button>'):'';
    return '<div class="uacct"><span class="av" aria-hidden="true" title="'+esc(em)+'">'+esc(ini)+'</span>'+(rail?'':'<span class="em"><b>'+(exp?'Session paused':'Signed in')+'</b><span>'+esc(em)+'</span></span>')+
      '<button type="button" class="toggle" '+aOut+' aria-label="Sign out" title="Sign out">'+ic('logout')+'</button></div>'+rec;
  }
  if(g.state==='busy')return '<div class="uacct"><span class="muted sm">'+(rail?'…':'Connecting…')+'</span></div>';
  return '<div class="uacct">'+(rail?'<button type="button" class="btn gbtn rb" '+aIn+' aria-label="Sign in with Google" title="Sign in with Google">'+gIcon()+'</button>':'<button type="button" class="btn gbtn" '+aIn+'>'+gIcon()+'Continue with Google</button>')+'</div>';
}

/* ---------- boot ---------- */
try{var sp0=localStorage.getItem('kb-side');ui.collapsed=sp0==null?isAppMode():sp0==='1'}catch(e){ui.collapsed=isAppMode()}
try{var pv0=localStorage.getItem('kb-priv');ui.priv=pv0==='1'}catch(e){}
try{var th0=localStorage.getItem('kb-theme');if(th0==='dark'||th0==='light'||th0==='heritage')document.documentElement.setAttribute('data-theme',th0);else document.documentElement.setAttribute('data-theme','light')}catch(e){document.documentElement.setAttribute('data-theme','light')}
var savedG=gLoadSess();
if(savedG&&(savedG.email||savedG.token)){
  g.email=savedG.email||'';
  g.fileId=savedG.fileId||'';
  if(savedG.token&&savedG.exp&&Date.now()<savedG.exp-30000){g.token=savedG.token;g.exp=savedG.exp}
  g.state='in';
}
var local=loadLocal();
loadedLocal=!!local;
S=normalize(local||examples());
ui.month=focusMonth();
route();
render();

function syncBootAutomation(){
  var nRec=processRecurring(), snapped=syncAutoSnapshots();
  if((nRec>0||snapped)&&!S.examples){
    ui.month=focusMonth();
    commit(true);
    render();
    if(nRec>0)setStatus('Logged '+nRec+' due recurring item'+(nRec>1?'s':''));
  }
}

function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms)})])}
function initRemote(){
  if(!window.claude||!window.claude.use){setStatus('Saved in this browser only');return}
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0], user=r[1];
    if(!db||!user){setStatus('Saved in this browser only');return}
    return user.id().then(function(id){
      if(!id){setStatus('Saved in this browser only');return}
      var doc=db.doc('data/users/'+id+'/tracker');
      return withTimeout(doc.get(),10000).then(function(snap){
        remoteDoc=doc;
        if(snap.exists){
          var d=snap.data();
          if(d&&d.s&&Array.isArray(d.s.assets)){S=normalize(d.s);ui.month=focusMonth();render()}
          setStatus('Saved to your account');
        }else{
          setStatus('Saved to your account');
          if(loadedLocal)flush();
        }
      });
    });
  }).catch(function(){remoteDoc=null;setStatus('Saved in this browser only')});
}
setStatus(g.state==='in'?(gTokenValid()?'Connecting to your Google Drive…':'Drive sync paused · Tap Reconnect'):'Saved in this browser only');
withTimeout(fetch('/google-config.json').then(function(res){
  if(!res.ok)throw new Error('Google configuration unavailable');
  return res.json();
}),5000).then(function(cfg){
  GID=cfg.clientId||'';
  if(g.state!=='in'){gSet(GID?'out':'off','');syncBootAutomation()}
  else if(gTokenValid()){
    gScheduleRefresh();
    gConnect().then(function(){setStatus('Saved to your Google Drive');gSaveSess();syncBootAutomation();render()},function(e){
      remoteDoc=null;
      syncBootAutomation();
      if(e&&e.message==='Sign-in expired'){g.token='';g.exp=0;gSaveSess();setStatus('Drive sync paused · Tap Reconnect');render()}
      else setStatus('Could not reach Google Drive: '+(e&&e.message||'network error'));
    });
  }else if(GID){
    setStatus('Drive sync paused · Tap Reconnect');
    syncBootAutomation();
  }else syncBootAutomation();
},function(){
  if(g.state!=='in')gSet('off','Google sign-in is unavailable right now. Your data stays in this browser.');
  syncBootAutomation();
});

})();
</script>
<script>
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
