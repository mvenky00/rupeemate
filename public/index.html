<style>
/* Layout: one column ledger. Brand strip, section tabs, ruled cards. Every entry is made in a bottom sheet with icon pickers. */
:root{
  --bg:#edf0f4; --surface:#ffffff; --surface-2:#f4f6f9; --ink:#14202b; --ink-2:#465564; --ink-3:#6f7d8b; --line:#d8dee5;
  --accent:#2250d4; --accent-soft:#e2e9ff;
  --good:#12784f; --good-soft:#d9f2e6; --warn:#955400; --warn-soft:#fbebc8; --bad:#b3261e; --bad-soft:#fbe1de;
  --c1:#2250d4; --c2:#7a4cd0; --c3:#0a87a3; --c4:#5b6b7b; --c5:#c07a05; --c6:#b3522a; --c7:#2c8a43; --c8:#c0376a; --c9:#7d8f1f; --c10:#6d5a3d; --c11:#d1495b;
  --scrim:rgba(8,14,20,.5); --line-2:var(--line);
  --serif:'Cormorant SC','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --surface-2:#1d2935; --ink:#e8edf2; --ink-2:#aab6c2; --ink-3:#8493a1; --line:#2a3846;
  --accent:#7b9bff; --accent-soft:#1f2c4d;
  --good:#4fcf95; --good-soft:#143a2b; --warn:#f0b24a; --warn-soft:#3d2d0f; --bad:#ff8a80; --bad-soft:#42201d;
  --c1:#7b9bff; --c2:#b394f2; --c3:#4cc3dd; --c4:#94a3b3; --c5:#e8ac3f; --c6:#ef8c60; --c7:#5ccb78; --c8:#f07aa5; --c9:#c0d14a; --c10:#b39b78; --c11:#ff8fa0;
  --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums}
.wrap{max-width:none;margin:0;padding:0}
h1,h2,h3,p{margin:0}
button{font-family:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:14px;height:14px;background:var(--accent);transform:rotate(45deg);flex:none}
.brand h1{font-size:18px;letter-spacing:0;text-transform:none;font-weight:700}
.brand h1 .m{color:var(--c5)}
.logo{width:32px;height:32px;flex:none;display:block}
.brand p{font-size:11px;color:var(--ink-3)}
.status{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.shell{display:flex;align-items:flex-start;min-height:100vh}
.main{flex:1;min-width:0;padding:18px max(16px,env(safe-area-inset-right,0px)) 96px 22px}
.main-in{max-width:1240px;margin-inline:auto}
@media (min-width:1600px){.main-in{max-width:1320px}}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));width:224px;flex:none;display:flex;flex-direction:column;gap:6px;background:var(--surface);border-right:1px solid var(--line);padding:14px 12px 16px max(12px,env(safe-area-inset-left,0px));overflow-y:auto;overflow-x:hidden}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 0 2px}
.side .brand{padding:0 4px;margin:0;min-width:0}
.side .brand h1{white-space:nowrap}
.side .brand p{white-space:nowrap}
.side nav{display:grid;gap:2px;margin-top:16px}
.side nav a{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500;border-left:3px solid transparent;white-space:nowrap}
.side nav a svg{width:20px;height:20px;flex:none}
.side nav a:hover{background:var(--surface-2);color:var(--ink)}
.side nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);border-left-color:var(--accent)}
.side .status{margin-top:auto;padding:0 6px;overflow-wrap:anywhere}
.side .toggle{display:inline-grid;place-items:center;width:36px;height:36px;border:0;background:none;color:var(--ink-2);border-radius:6px;cursor:pointer;flex:none}
.side .toggle:hover{background:var(--surface-2);color:var(--ink)}
.side .toggle svg{width:20px;height:20px;flex:none}
.side.rail{width:64px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px}
.side.rail .brand div,.side.rail .status,.side.rail nav a span{display:none}
.side.rail .brandrow{flex-direction:column;gap:8px}
.side.rail .brand{padding:6px 0 0;display:flex;justify-content:center}
.side.rail nav a{justify-content:center;padding:10px 0;border-left-width:0;border-bottom:3px solid transparent;border-radius:6px}
.side.rail nav a[aria-current="page"]{border-bottom-color:var(--accent)}

.side .sep{height:1px;background:var(--line);margin:8px 6px}
.side nav a{padding:9px 10px}
.side .foot{margin-top:auto;display:grid;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.appear{display:grid;gap:8px;padding:2px 6px 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tseg{display:flex;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:2px;gap:2px;letter-spacing:0;text-transform:none}
.tseg button{flex:1;justify-content:center;display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--ink-2);padding:5px 6px;border-radius:99px;font:500 12px var(--font);cursor:pointer;white-space:nowrap}
.tseg button svg{width:14px;height:14px}
.tseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.side.rail .sep{margin:8px 4px}
.hero2{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,1.5fr);gap:26px;align-items:center}
@media (max-width:900px){.hero2{grid-template-columns:1fr!important;justify-items:start}}
.donut{width:180px;height:180px;display:block}
.donut .dn-v{fill:var(--ink);font:600 16px var(--mono);text-anchor:middle}
.donut .dn-l{fill:var(--ink-3);font:12px var(--font);text-anchor:middle}
.dlist{list-style:none;margin:0;padding:0;display:grid;gap:2px;width:100%}
.dlist li{display:grid;grid-template-columns:minmax(0,1fr) auto 52px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.dlist li:last-child{border-bottom:0}
.dlist .mono{font-size:13px;text-align:right;white-space:nowrap}
.gauge{width:100%;max-width:190px;display:block}
.gauge .tr{fill:none;stroke:var(--surface-2);stroke-width:14;stroke-linecap:round}
.gauge .tk{fill:none;stroke:var(--line);stroke-width:1}
.gauge .vl{fill:none;stroke-width:14;stroke-linecap:round}
.gauge .gv{fill:var(--ink);font:600 20px var(--mono);text-anchor:middle}
.gauge .gl{fill:var(--ink-3);font:12px var(--font);text-anchor:middle}
.gcard{display:grid;justify-items:center;text-align:center;gap:4px}
.brow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .bmain{flex:1;min-width:0}
.tip{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.tip:last-child{border-bottom:0}
.tip .ico{margin-top:1px}
.tip.good .ico{color:var(--good);background:var(--good-soft)}
.tip.warn .ico{color:var(--warn);background:var(--warn-soft)}
.tip.bad .ico{color:var(--bad);background:var(--bad-soft)}
.tip b{display:block;font-weight:600}
.tip span.t{color:var(--ink-2);font-size:13px}
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.greet h2{font-size:22px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);margin:0}
.kpi5{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px}
.sfoot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:16px -18px calc(-20px - env(safe-area-inset-bottom,0px));padding:12px 18px calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:grid;gap:8px}
.sfoot .err{margin:0}
.btn.sm svg{width:16px;height:16px;flex:none}
.btn.sm{white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.lk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.lk[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.lk[disabled]{opacity:.5;cursor:not-allowed}
.lk .nm{min-width:0}.lk .nm b{display:block;font-weight:500;overflow-wrap:anywhere}
.lkwrap{display:grid;gap:6px}
.lkpct{display:flex;gap:6px;flex-wrap:wrap;padding:2px 2px 6px 46px}
.lklist{display:flex;gap:8px;flex-wrap:wrap}
.lkchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:13px;min-width:0}
.gwarn{display:flex;gap:8px;align-items:flex-start;color:var(--warn);font-size:13px}
.gwarn svg{width:16px;height:16px;flex:none;margin-top:1px}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.hbar{display:grid;grid-template-columns:130px 1fr 46px;gap:10px;align-items:center;font-size:13px;margin-bottom:10px}
.hbar .mono{text-align:right;font-size:12px}
.news li{margin-bottom:6px;color:var(--ink-2)}
.set textarea{width:100%;min-height:120px;font:12px/1.4 var(--mono);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:8px;resize:vertical}

:root[data-theme="heritage"]{
  --bg:#ece5cb; --surface:#f6f1de; --surface-2:#ebe5ca; --ink:#16281d; --ink-2:#3f4e40; --ink-3:#66705a; --line:#b9c4a6; --line-2:#1f4d34;
  --accent:#1f4d34; --accent-soft:#d9e4cc;
  --good:#1f6b3f; --good-soft:#d6e8d0; --warn:#85560a; --warn-soft:#efdfb0; --bad:#9c2a22; --bad-soft:#efd4cb;
  --c1:#1f4d34; --c2:#7a4a2b; --c3:#3d7a7a; --c4:#7d7f6b; --c5:#b8892a; --c6:#a3522a; --c7:#4f8a4a; --c8:#9a4a6a; --c9:#8a9a2f; --c10:#6d5a3d; --c11:#b0483f;
  --scrim:rgba(22,40,29,.55);
  color-scheme:light;
}
:root[data-theme="heritage"] body{background-color:var(--bg);background-image:repeating-radial-gradient(circle at 92% -8%,transparent 0 16px,rgba(31,77,52,.05) 16px 17px),repeating-radial-gradient(circle at -6% 108%,transparent 0 16px,rgba(184,137,42,.07) 16px 17px);background-attachment:fixed}
:root[data-theme="heritage"] .card{border:1px solid var(--line-2);border-radius:2px;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line)}
:root[data-theme="heritage"] .card{padding:22px}
:root[data-theme="heritage"] .card h2,:root[data-theme="heritage"] .card h3,:root[data-theme="heritage"] .greet h2{font:700 17px/1.2 var(--serif);letter-spacing:.07em;text-transform:none;color:var(--ink)}
:root[data-theme="heritage"] .greet h2{font-size:26px}
:root[data-theme="heritage"] .big,:root[data-theme="heritage"] .mid,:root[data-theme="heritage"] .gauge .gv,:root[data-theme="heritage"] .donut .dn-v{font-family:var(--serif);font-weight:700;letter-spacing:0;font-feature-settings:"lnum" 1,"tnum" 1}
:root[data-theme="heritage"] .big{font-size:clamp(36px,6.5vw,58px)}
:root[data-theme="heritage"] .mid{font-size:30px}
:root[data-theme="heritage"] .brand h1{font:700 21px var(--serif);letter-spacing:.02em;text-transform:none}
:root[data-theme="heritage"] .mark{border-radius:50%;transform:none;background:radial-gradient(circle at 35% 30%,#f0d78a,#b8892a 70%);box-shadow:0 0 0 2px var(--surface),0 0 0 3px #b8892a;width:16px;height:16px}
:root[data-theme="heritage"] .side{background:var(--surface);border-right:1px solid var(--line-2)}
:root[data-theme="heritage"] .btn,:root[data-theme="heritage"] .chip,:root[data-theme="heritage"] .in{border-radius:2px}
:root[data-theme="heritage"] .tseg,:root[data-theme="heritage"] .tseg button{border-radius:2px}
:root[data-theme="heritage"] .pill{border-radius:2px}
:root[data-theme="heritage"] .tbl th{font-family:var(--serif);font-size:13px;letter-spacing:.08em;color:var(--ink-2);text-transform:none}
.uacct{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);margin-top:6px;padding:10px 4px 2px}
.uacct .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:600 13px var(--font);flex:none}
.uacct .em{min-width:0;flex:1;font-size:12px;line-height:1.3}
.uacct .em b{display:block;font-weight:600;font-size:13px}
.uacct .em span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-3)}
.uacct .btn{width:100%;justify-content:center}
.btn svg{width:18px;height:18px;flex:none}
.btn.gbtn{background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:500;gap:10px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.btn.gbtn:hover{background:#f6f8fb}
.btn.gbtn:disabled{opacity:.65;cursor:not-allowed}
.btn.gbtn.rb{width:38px;height:38px;padding:0;border-radius:50%}
.gbtn svg{width:18px;height:18px}
.side.rail .uacct{flex-direction:column;padding:8px 0 2px}
.side.rail .uacct .em{display:none}
.side-sp{display:none}
@media (max-width:640px){
  .main{padding-left:12px}
  .side-sp{display:block;width:64px;flex:none}
  .side{position:fixed;left:0;top:env(safe-area-inset-top,0px);z-index:30}
  .side:not(.rail){box-shadow:6px 0 22px rgba(0,0,0,.28)}
  .in{font-size:16px}
  .set textarea{font-size:13px}
}
@media (max-width:480px){
  .main{padding-left:12px;padding-right:12px}
  .main-in{max-width:none}
  .card{padding:14px}
  :root[data-theme="heritage"] .card{padding:16px}
  .kpi5{grid-template-columns:1fr 1fr}
  .greet h2{font-size:19px}
  .greet{align-items:flex-start}
  .big{font-size:30px}
  .fab{height:48px;padding:0 14px 0 12px;font-size:13px}
}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs a{padding:9px 14px;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack-v{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;min-width:0}
.card h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.card>.row:first-child{margin-bottom:12px}
.card>h2:first-child{margin-bottom:12px}
.card h3{font-size:15px;font-weight:600}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.g2>*,.g3>*{min-width:0}
.big{font:500 clamp(30px,6vw,46px)/1.1 var(--mono);letter-spacing:-.02em}
.mid{font:500 24px/1.2 var(--mono)}
.muted{color:var(--ink-3)}
.sm{font-size:12px}
.mono{font-family:var(--mono)}
.r{text-align:right}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:16px}
.btn{font:500 13px var(--font);border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}

.btn.big{width:100%;justify-content:center;padding:13px;font-size:15px}
.plus{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.plus svg{width:20px;height:20px}
.link{font:inherit;font-size:12px;background:none;border:0;color:var(--ink-3);cursor:pointer;text-decoration:underline;padding:4px}

.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:560px;table-layout:fixed}

.tbl .mono{font-size:13px}

.tbl td.r,.tbl td.mono{white-space:nowrap}
.acts{display:flex;gap:4px;justify-content:flex-end;align-items:center;flex-wrap:nowrap}
.iconbtn{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:inline-grid;place-items:center;cursor:pointer;flex:none}

.iconbtn:hover{border-color:var(--ink-3);color:var(--ink)}

.tbl tfoot td{border-bottom:0;font-weight:600}
.cell{display:flex;align-items:center;gap:10px;min-width:0}
.tbl .cell .in{min-width:140px}
.tbl .in.num{min-width:112px}
.ico{width:34px;height:34px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:inline-grid;place-items:center;flex:none;color:var(--ink-2)}
.ico svg{width:19px;height:19px}
.ico.sm{width:28px;height:28px;border-radius:6px}.ico.sm svg{width:16px;height:16px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.in.num{text-align:right;font-family:var(--mono)}
label{display:grid;gap:4px;font-size:12px;color:var(--ink-2)}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:18px 0 8px}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.good>i{background:var(--good)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.stack{display:flex;gap:2px;height:16px}
.stack span{display:block;min-width:2px;border-radius:2px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:4px 14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.chart{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-3);font:12.5px var(--mono)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .area{fill:var(--accent);fill-opacity:.1}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .endlab{fill:var(--ink);font:600 13px var(--mono)}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{min-width:96px;text-align:center;font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;text-align:right;font-family:var(--mono)}
.goal{display:grid;gap:14px}
.goalgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;background:var(--surface-2);border-radius:4px;padding:12px}
.res div span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.res div b{font:500 17px var(--mono)}
details summary{cursor:pointer;color:var(--ink-2);font-size:13px}
.acc{display:grid;gap:12px}
.acc .head{display:flex;gap:12px;align-items:center;min-width:0}
.acc .head>div:nth-child(2){min-width:0;flex:1}
.acc .head b{display:block;overflow-wrap:anywhere}
.acc ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.acc li{display:flex;justify-content:space-between;gap:10px}
.acc li span:first-child{min-width:0;overflow-wrap:anywhere;color:var(--ink-2)}
.acc .edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-top:10px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;height:52px;padding:0 18px 0 14px;border-radius:26px;border:0;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:8px;font:600 14px var(--font);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28)}
:root[data-theme="dark"] .fab{color:#0f161d}
.fab svg{width:22px;height:22px}
/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:620px;max-height:94%;overflow-y:auto;border-radius:16px 16px 0 0;border:1px solid var(--line);padding:10px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.shead h2{font-size:18px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink)}
.x{border:0;background:var(--surface-2);color:var(--ink-2);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.x svg{width:18px;height:18px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:12px;max-height:90%}.grab{display:none}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:9px;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.amt{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--line);padding:6px 0;margin-top:14px}
.amt:focus-within{border-color:var(--accent)}
.amt span{font:500 30px var(--mono);color:var(--ink-3)}
.amt input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 34px var(--mono);outline:0;padding:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tile{display:grid;justify-items:center;gap:4px;padding:10px 4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink-2);font-size:12px;cursor:pointer;text-align:center;min-width:0}
.tile svg{width:22px;height:22px}
.tile span{overflow-wrap:anywhere}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink);text-align:left;cursor:pointer;min-width:0}
.opt:hover,.tile:hover{border-color:var(--ink-3)}
.opt>span:last-child{min-width:0}
.opt b{display:block;font-weight:600;font-size:14px}
.opt small{display:block;color:var(--ink-3);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sel{display:flex;align-items:center;gap:10px;margin:12px 0 2px}
.fields{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:13px;margin:10px 0 0}
.back{border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:13px;padding:4px 0}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}

/* ---------- derived numbers ---------- */
function inr(v,c){return v*(c==='INR'?1:(S.fx[c]||1))}
/* balance in account terms: card = dues owed, others = money held */
function accBal(a){
  var b=a.open||0;
  S.flows.forEach(function(f){
    if(f.acc!==a.id)return;
    if(a.type==='card')b+=(f.type==='exp'?f.amt:-f.amt);
    else b+=(f.type==='inc'?f.amt:-f.amt);
  });
  return b;
}
function accSigned(a){var b=accBal(a);return a.type==='card'?-b:b}
function liabCalc(l){
  var r=(l.rate||0)/1200, P=l.val, E=l.emi||0, n=null;
  if(P<=0)n=0;
  else if(E>0){if(r===0)n=P/E;else if(E>P*r)n=-Math.log(1-P*r/E)/Math.log(1+r)}
  return {months:n==null?null:Math.ceil(n)};
}
function fmtMonths(m){var y=Math.floor(m/12),mo=m%12;return (y?y+' yr ':'')+(mo||!y?mo+' mo':'')}
function payoffDate(m){var d=new Date();d.setMonth(d.getMonth()+m);return d.toLocaleDateString('en-IN',{month:'short',year:'numeric'})}
function debtParts(){
  var by={},out=[];
  S.liabs.forEach(function(l){var t=ltypeOf(l.type);by[t.k]=(by[t.k]||0)+l.val});
  var cards=0,over=0;
  S.accounts.forEach(function(a){var v=accSigned(a);if(v<0){if(a.type==='card')cards+=-v;else over+=-v}});
  by.card=(by.card||0)+cards;
  LTYPES.forEach(function(t){if(by[t.k]>0)out.push({n:t.k==='card'?'Credit cards':t.n,v:by[t.k],c:LCOLOR[t.k]})});
  if(over>0)out.push({n:'Overdrawn accounts',v:over,c:'--c10'});
  return out.sort(function(a,b){return b.v-a.v});
}
function donut(parts,top,bot){
  var total=parts.reduce(function(s,p){return s+p.v},0), R=70, C=2*Math.PI*R, off=0, segs='';
  if(total>0){parts.forEach(function(p){if(!(p.v>0))return;var len=C*p.v/total;segs+='<circle cx="90" cy="90" r="'+R+'" fill="none" style="stroke:var('+p.c+')" stroke-width="22" stroke-dasharray="'+Math.max(0,len-1.5).toFixed(2)+' '+(C-Math.max(0,len-1.5)).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 90 90)"><title>'+esc(p.n+' '+fmtINR(p.v))+'</title></circle>';off+=len})}
  return '<svg class="donut" viewBox="0 0 180 180" role="img" aria-label="'+esc(bot+' '+top)+'"><circle cx="90" cy="90" r="'+R+'" fill="none" style="stroke:var(--surface-2)" stroke-width="22"/>'+segs+'<text class="dn-v" x="90" y="92">'+esc(top)+'</text><text class="dn-l" x="90" y="110">'+esc(bot)+'</text></svg>';
}

function lentCalc(l){
  var p=(l.d||today()).split('-').map(Number), days=Math.max(0,Math.floor((Date.now()-new Date(p[0],p[1]-1,p[2]).getTime())/864e5));
  var interest=l.princ*l.rate/100*days/365, total=l.princ+interest;
  return {days:days,interest:interest,total:total,due:Math.max(0,total-(l.recv||0)),perMonth:l.princ*l.rate/100/12};
}
function lentSummary(){
  var r={P:0,I:0,R:0,due:0,perMonth:0,wr:0,count:S.lent.length,avg:0};
  S.lent.forEach(function(l){var c=lentCalc(l);r.P+=l.princ;r.I+=c.interest;r.R+=(l.recv||0);r.due+=c.due;if(c.due>0)r.perMonth+=c.perMonth;r.wr+=l.princ*l.rate});
  r.avg=r.P>0?r.wr/r.P:0;return r;
}
function portfolio(){
  var inv=0,cur=0,n=0;
  var cn=0,cd=0;
  S.assets.forEach(function(a){if(a.inv>0){inv+=inr(a.inv,a.cur);cur+=inr(a.val,a.cur);n++;var r=retOf(a);if(r&&r.cagr!=null){cn+=inr(a.inv,a.cur)*r.cagr;cd+=inr(a.inv,a.cur)}}});
  return {inv:inv,cur:cur,ret:cur-inv,pct:inv>0?(cur-inv)/inv:null,n:n,cagr:cd>0?cn/cd:null};
}
function retOf(a){
  if(!(a.inv>0))return null;
  var i=inr(a.inv,a.cur), c=inr(a.val,a.cur), r={amt:c-i,pct:(c-i)/i,cagr:null};
  if(a.bd){var p=a.bd.split('-').map(Number), yrs=(Date.now()-new Date(p[0],p[1]-1,p[2]).getTime())/(365.25*864e5);if(yrs>=0.25&&c>0)r.cagr=Math.pow(c/i,1/yrs)-1}
  return r;
}
function totals(){
  var a=S.assets.reduce(function(s,x){return s+inr(x.val,x.cur)},0);
  var l=S.liabs.reduce(function(s,x){return s+x.val},0);
  S.accounts.forEach(function(x){var v=accSigned(x);if(v>=0)a+=v;else l+=-v});
  S.lent.forEach(function(x){a+=lentCalc(x).due});
  return {a:a,l:l,nw:a-l};
}
function byClass(){
  var m={};CLS.forEach(function(c){m[c.k]=0});
  S.assets.forEach(function(x){m[x.cls]=(m[x.cls]||0)+inr(x.val,x.cur)});
  S.accounts.forEach(function(x){if(x.type!=='card')m.cash+=Math.max(0,accSigned(x))});
  S.lent.forEach(function(x){m.lent+=lentCalc(x).due});

function goalCalc(g){
  var n=Math.max(g.years,0), i=g.infl/100, r=g.ret/100, lm=linkMap(), linked=0, grownL=0, items=[];
  (g.links||[]).forEach(function(l){var x=lm[l.k];if(!x)return;var v=x.val*l.p/100;linked+=v;grownL+=v*Math.pow(1+(CLSRET[x.cls]||6)/100,n);items.push({x:x,p:l.p,v:v})});
  var manual=g.saved||0, fv=g.today*Math.pow(1+i,n), grown=manual*Math.pow(1+r,n)+grownL, gap=Math.max(0,fv-grown);
  var N=Math.round(n*12), m=r/12, sip=0;
  if(gap>0){if(N>0){sip=m>0?gap*m/((Math.pow(1+m,N)-1)*(1+m)):gap/N}else{sip=gap}}
  return {fv:fv,grown:grown,gap:gap,sip:sip,funded:fv>0?Math.min(1,grown/fv):1,linked:linked,manual:manual,have:linked+manual,items:items};
}
function goalWarnings(g,c){

  c.items.forEach(function(it){if(['eq','gl','crypto'].indexOf(it.x.cls)>=0)risky.push(it.x.name);if(['ret','re'].indexOf(it.x.cls)>=0)locked.push(it.x.name)});
  if(n<=3&&risky.length)w.push(risky.join(', ')+(risky.length>1?' are':' is')+' market-linked. With '+n+' years left, a fall could hurt this goal. Consider moving to safer holdings.');
  if(n<=3&&locked.length)w.push(locked.join(', ')+(locked.length>1?' may':' may')+' be locked or slow to sell before this goal is due.');
  if(n>=7&&c.items.length&&c.items.every(function(it){return ['debt','cash'].indexOf(it.x.cls)>=0}))w.push('All linked money is in fixed-return holdings. Over '+n+' years inflation may outrun it. Some equity or mutual funds can help.');
  return w;
}
function safetyCalc(){
  var ms=monthsWithData().slice(-3), e=0, inc=0;
  ms.forEach(function(k){var s=monthStats(k);e+=s.exp;inc+=s.inc});
  var n=ms.length||1, avgE=e/n, avgI=inc/n, cash=byClass().cash, sf=S.safety;
  var annual=avgI*12, termNeed=annual*sf.mult;
  var efM=avgE>0?cash/avgE:null;
  var efR=efM==null||sf.months<=0?null:Math.min(1,efM/sf.months);
  var tR=termNeed>0?Math.min(1,sf.term/termNeed):null;
  var hR=sf.hbench>0?Math.min(1,sf.health/sf.hbench):null;
  var parts=[[efR,.5],[tR,.3],[hR,.2]].filter(function(p){return p[0]!=null});
  var w=parts.reduce(function(s,p){return s+p[1]},0);
  var score=w>0?Math.round(100*parts.reduce(function(s,p){return s+p[0]*p[1]},0)/w):null;
  return {avgE:avgE,avgI:avgI,cash:cash,efM:efM,efR:efR,annual:annual,termNeed:termNeed,tR:tR,hR:hR,score:score,nMonths:ms.length};
}

function chartWidth(half){
  var sw=(window.innerWidth<=640||ui.collapsed)?64:224;
  var pad=window.innerWidth<=640?12+16:22+16;
  var el=document.querySelector('.main-in')||document.querySelector('.main');
  var avail=(el&&el.clientWidth>140)?el.clientWidth-38:window.innerWidth-sw-pad-38;
  var w=(half&&avail>=2*340+16+76)?(avail-16)/2-38+38:avail;
  return Math.max(300,Math.min(1100,Math.round(half&&avail>=2*340+16+76?(avail-16)/2:avail)));
}
function lineChart(pts){
  if(pts.length<2)return '<p class="muted">Save a snapshot each month and your net worth trend appears here.</p>';
  var W=chartWidth(false),H=240,L=68,R=84,T=22,B=30;
  var lo=Math.min.apply(null,pts.map(function(p){return p.v})), hi=Math.max.apply(null,pts.map(function(p){return p.v}));
  if(hi===lo){hi+=1;lo-=1}
  var pd=(hi-lo)*.18; lo-=pd; hi+=pd;
  var X=function(i){return L+(W-L-R)*i/(pts.length-1)};
  var Y=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo))};
  var g='';
  for(var i=0;i<4;i++){var v=lo+(hi-lo)*i/3,y=Y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="ax" x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+fmtC(v)+'</text>'}
  var path=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)}).join(' ');
  var area=path+' L'+X(pts.length-1).toFixed(1)+' '+(H-B)+' L'+X(0).toFixed(1)+' '+(H-B)+' Z';
  var dots=pts.slice(0,-1).map(function(p,i){return '<circle class="pt" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5"/>'}).join('');
  var xl=pts.map(function(p,i){return '<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===pts.length-1?'end':'middle')+'">'+esc(p.label)+'</text>'}).join('');
  var last=pts[pts.length-1], lx=X(pts.length-1), ly=Y(last.v);
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Net worth over time, now '+esc(fmtC(last.v))+'">'+g+'<path class="area" d="'+area+'"/><path class="line" d="'+path+'"/>'+dots+'<circle class="end" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="5.5"/><text class="endlab" x="'+(lx+12).toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="start">'+fmtC(last.v)+'</text>'+xl+'</svg>';
}
function barChart(months){
  var data=months.map(function(k){var s=monthStats(k);return {k:k,inc:s.inc,exp:s.exp}});
  var raw=Math.max.apply(null,[0].concat(data.map(function(d){return Math.max(d.inc,d.exp)})));
  if(raw<=0)return '<p class="muted">Log income and spending to see the last six months here.</p>';
  var mx=niceMax(raw), W=chartWidth(true),H=240,L=68,R=12,T=14,B=30, gw=(W-L-R)/data.length, bw=Math.min(34,gw/2-4);
  var Y=function(v){return T+(H-T-B)*(1-v/mx)};
  var g='';
  [0,.5,1].forEach(function(f){var y=Y(mx*f);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text class="ax" x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+fmtC(mx*f)+'</text>'});
  var bars=data.map(function(d,i){
    var cx=L+gw*(i+.5), hi=(H-T-B)*d.inc/mx, he=(H-T-B)*d.exp/mx;
    return '<rect x="'+(cx-bw-1).toFixed(1)+'" y="'+(H-B-hi).toFixed(1)+'" width="'+bw+'" height="'+hi.toFixed(1)+'" style="fill:var(--c1)"><title>'+esc(monthLabel(d.k)+' income '+fmtINR(d.inc))+'</title></rect>'+
      '<rect x="'+(cx+1).toFixed(1)+'" y="'+(H-B-he).toFixed(1)+'" width="'+bw+'" height="'+he.toFixed(1)+'" style="fill:var(--c5)"><title>'+esc(monthLabel(d.k)+' spending '+fmtINR(d.exp))+'</title></rect>'+
      '<text class="ax" x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(monthLabel(d.k,true))+'</text>';
  }).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Income and spending, last six months">'+g+bars+'</svg>'+
    '<div class="legend"><span><i class="dot" style="background:var(--c1)"></i>Income</span><span><i class="dot" style="background:var(--c5)"></i>Spending</span></div>';
}

function vAllocation(){
  var t=totals(), cl=byClass(), tsum=CLS.reduce(function(s,c){return s+(S.target[c.k]||0)},0);
  var rows=CLS.map(function(c){
    var cur=t.a>0?cl[c.k]/t.a*100:0, tg=S.target[c.k]||0, dr=cur-tg, move=Math.abs(dr)/100*t.a, on=Math.abs(dr)<2||t.a<=0;
    return '<tr><td><i class="dot" style="background:var('+c.c+')"></i>'+esc(c.n)+'</td><td class="r mono">'+fmtINR(cl[c.k])+'</td><td class="r mono">'+cur.toFixed(1)+'%</td><td style="width:100px">'+inp('tg|'+c.k+'|x',tg,'num','Target percent for '+c.n)+'</td><td class="r mono '+(on?'':'warn')+'">'+(dr>0?'+':'')+dr.toFixed(1)+'</td><td class="r">'+(on?'<span class="pill good">On target</span>':'<span class="pill warn">'+(dr>0?'Trim ':'Add ')+fmtC(move)+'</span>')+'</td></tr>';
  }).join('');
  var nowParts=CLS.map(function(c){return {n:c.n,c:c.c,pct:t.a>0?cl[c.k]/t.a*100:0}});
  var tgtParts=CLS.map(function(c){return {n:c.n,c:c.c,pct:tsum>0?(S.target[c.k]||0)/tsum*100:0}});
  return '<div class="stack-v"><div class="card"><h2>Now and target</h2><p class="sm muted" style="margin-bottom:6px">Now</p>'+(t.a>0?stackBar(nowParts):'<p class="muted">No assets yet.</p>')+'<p class="sm muted" style="margin:12px 0 6px">Target</p>'+stackBar(tgtParts)+'</div>'+
  '<div class="card"><div class="row"><h2>Drift from target</h2>'+(tsum===100?'':'<span class="pill bad">Targets add up to '+tsum+'%, should be 100%</span>')+'</div><div class="scroll"><table class="tbl" style="min-width:640px"><thead><tr><th style="width:24%">Class</th><th class="r" style="width:16%">Value</th><th class="r" style="width:10%">Now</th><th class="r" style="width:14%">Target %</th><th class="r" style="width:14%">Drift (pts)</th><th class="r" style="width:22%">Suggested move</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>Total</td><td class="r mono">'+fmtINR(t.a)+'</td><td class="r mono">100%</td><td class="r mono">'+tsum+'%</td><td></td><td></td></tr></tfoot></table></div>'+
  '<p class="muted sm" style="margin-top:10px">A class is on target when it is within 2 points. Suggested moves are the rupee amount needed to match your target at today\'s total.</p></div></div>';
}

function openSheet(kind,preset,edit){
  var d={}, step=1;
  if(kind==='txn')d={type:'exp',amt:'',cat:'',dateMode:'today',date:today(),acc:preset||'',note:''};
  if(kind==='asset')d={cls:'',name:'',cur:'INR',inv:'',val:'',bd:''};
  if(kind==='lent')d={name:'',princ:'',rate:'',dateMode:'today',date:today(),recv:'0'};
  if(kind==='pay')d={id:preset||'',amt:''};
  if(kind==='liab')d={type:'',name:'',val:'',emi:'',rate:''};
  if(kind==='budget')d={cat:preset||'',limit:''};
  if(kind==='acct')d={type:'',provider:'',nick:'',last4:'',bal:''};
  if(kind==='goal')d={name:'',today:'',years:'10',infl:'6',ret:'11',saved:'0',links:{}};
  if(kind==='del'){var lst=LISTOF[preset], rec=S[lst].filter(function(x){return x.id===edit})[0];d={k:preset,list:lst,id:edit,label:rec?(rec.name||rec.cat||accName(rec)||'this entry'):'this entry'}}
  else if(edit){
    var r0=S[LISTOF[kind]].filter(function(x){return x.id===edit})[0];
    if(!r0)return;
    if(kind==='asset'){d={cls:r0.cls,name:r0.name,cur:r0.cur,inv:r0.inv>0?String(r0.inv):'',val:String(r0.val),bd:r0.bd||''};step=2}
    else if(kind==='liab'){d={type:r0.type||'oth',name:r0.name,val:String(r0.val),emi:String(r0.emi||0),rate:r0.rate>0?String(r0.rate):''};step=2}
    else if(kind==='acct'){d={type:r0.type,provider:r0.provider||'',nick:r0.nick||'',last4:r0.last4||'',bal:String(r0.open||0)};step=2}
    else if(kind==='lent'){d={name:r0.name,princ:String(r0.princ),rate:String(r0.rate),dateMode:'pick',date:r0.d,recv:String(r0.recv||0)}}
    else if(kind==='txn'){d={type:r0.type,amt:String(r0.amt),cat:r0.cat,dateMode:'pick',date:r0.d,acc:r0.acc||'',note:r0.note||''}}
    else if(kind==='budget'){d={cat:r0.cat,limit:String(r0.limit)}}
    else if(kind==='goal'){d={name:r0.name,today:String(r0.today),years:String(r0.years),infl:String(r0.infl),ret:String(r0.ret),saved:String(r0.saved),links:(function(){var o={};(r0.links||[]).forEach(function(l){o[l.k]=l.p});return o})()}}
  }
  ui.sheet={kind:kind,step:step,d:d,err:'',edit:kind==='del'?'':(edit||'')};
  document.body.style.overflow='hidden';
  renderSheet(true);
}

function syncSheet(){

  host.querySelectorAll('[data-s]').forEach(function(el){ui.sheet.d[el.dataset.s]=el.value});
}
function linkRows(d,gid){
  var all=linkables(); if(!all.length)return '<p class="muted sm">Add an asset or a bank account first, then link it here.</p>';
  d.links=d.links||{};
  return all.map(function(x){
    var on=d.links[x.key]!=null, avail=100-allocElsewhere(x.key,gid), pct=on?d.links[x.key]:0;
    var row='<button type="button" class="lk" data-sa="lk-toggle" data-v="'+esc(x.key)+'" aria-pressed="'+on+'"'+(!on&&avail<=0?' disabled':'')+'><span class="ico" style="color:var('+x.color+')">'+ic(x.icon)+'</span><span class="nm"><b>'+esc(x.name)+'</b><span class="muted sm">'+esc(x.sub)+(avail<100?' · '+(100-avail)+'% in other goals':'')+'</span></span><span class="mono sm">'+(on?fmtC(x.val*pct/100)+' ('+pct+'%)':fmtC(x.val))+'</span></button>';
    if(on){var opts=[25,50,75,100].filter(function(q){return q<=avail});if(opts.indexOf(avail)<0&&avail>0)opts.push(avail);opts.sort(function(a,b){return a-b});
      row+='<div class="lkpct">'+opts.map(function(q){return '<button type="button" class="chip" data-sa="lk-pct" data-v="'+esc(x.key)+'|'+q+'" aria-pressed="'+(pct===q)+'">'+q+'%</button>'}).join('')+'</div>'}
    return '<div>'+row+'</div>';
  }).join('');
}
function tiles(list,sel,act,type){

function providerField(type,val){
  var t=atypeOf(type), h='';
  if(t.p==='none')return '';
  var label=t.p==='broker'?'Broker':t.p==='wallet'?'Wallet':type==='card'?'Card issuer':'Bank';
  h+='<label>'+label+'<select class="in" data-s="provider"><option value="">Select '+label.toLowerCase()+'</option>';
  if(t.p==='bank'){h+=BANKS.map(function(g){return '<optgroup label="'+esc(g[0])+'">'+g[1].map(function(b){return '<option'+(b===val?' selected':'')+'>'+esc(b)+'</option>'}).join('')+'</optgroup>'}).join('')}
  else{var l=t.p==='broker'?BROKERS:WALLETS;h+=l.map(function(b){return '<option'+(b===val?' selected':'')+'>'+esc(b)+'</option>'}).join('')}
  return h+'</select></label>';
}

  }else if(k==='liab'){

    put('liabs',{name:n2,type:d.type,val:Math.max(0,num(d.val)),emi:Math.max(0,num(d.emi)),rate:Math.max(0,num(d.rate))});
  }else if(k==='acct'){

    put('accounts',{type:d.type,provider:t.p==='none'?'':d.provider,nick:String(d.nick||'').trim(),last4:String(d.last4||'').replace(/\D/g,'').slice(0,4),open:num(d.bal)});
  }else if(k==='lent'){

    if(!(num(d.princ)>0)){s.err='Enter the principal amount.';return renderSheet()}
    var dt2=d.dateMode==='today'?today():d.dateMode==='yest'?yesterday():d.date;
    if(!dt2){s.err='Pick the date you lent it.';return renderSheet()}
    put('lent',{name:n4,princ:Math.max(0,num(d.princ)),rate:Math.max(0,num(d.rate)),d:dt2,recv:Math.max(0,num(d.recv))});
  }else if(k==='pay'){
    var ln2=S.lent.filter(function(x){return x.id===d.id})[0], pa=num(d.amt);
    if(!ln2){closeSheet();return}
    if(!(pa>0)){s.err='Enter the amount you received.';return renderSheet()}
    ln2.recv=(ln2.recv||0)+pa;
  }else if(k==='goal'){
    var n3=String(d.name||'').trim();
    if(!n3){s.err='Give the goal a name.';return renderSheet()}
    if(!(num(d.today)>0)){s.err='Enter what the goal costs today.';return renderSheet()}

  }

function commit(){
  try{localStorage.setItem('kb-ts',String(Date.now()))}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(remoteDoc){setStatus('Saving…');clearTimeout(saveT);saveT=setTimeout(flush,700)}
  else setStatus('Saved in this browser only');
}
function flush(){
  if(!remoteDoc)return;
  if(flushing){clearTimeout(saveT);saveT=setTimeout(flush,400);return}
  flushing=true;
  remoteDoc.set({v:1,s:JSON.parse(JSON.stringify(S))}).then(function(){setStatus('Saved to your Google Drive')},function(e){setStatus('Saved in this browser. Drive sync needs sign-in')}).then(function(){flushing=false});
}

var GID='', GSCOPE='https://www.googleapis.com/auth/drive.appdata openid email', GFILE='kanakku-book.json';
var g={state:'loading',email:'',msg:'',token:'',exp:0,fileId:'',client:null,timer:0};
function gSet(st,msg){g.state=st;g.msg=msg||'';if(!ui.sheet)render()}
function lts(){try{return +localStorage.getItem('kb-ts')||0}catch(e){return 0}}
function gReq(url,opt){
  if(!g.token||Date.now()>g.exp-30000)return Promise.reject(new Error('Sign-in expired'));
  opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+g.token},opt.headers||{});
  return fetch(url,opt).then(function(r){
    if(r.status===401){g.token='';throw new Error('Sign-in expired')}
    if(!r.ok)throw new Error('Drive error '+r.status);
    return r;
  });
}
function gFind(){
  return gReq('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=10&q='+encodeURIComponent("name='"+GFILE+"'")+'&fields=files(id)').then(function(r){return r.json()}).then(function(j){g.fileId=j.files&&j.files[0]?j.files[0].id:'';return g.fileId});
}
function gRead(){return gReq('https://www.googleapis.com/drive/v3/files/'+g.fileId+'?alt=media').then(function(r){return r.json()})}
function gWrite(obj){
  var body=JSON.stringify(obj);
  if(g.fileId)return gReq('https://www.googleapis.com/upload/drive/v3/files/'+g.fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:body});
  var b='kbx'+Date.now(), meta=JSON.stringify({name:GFILE,parents:['appDataFolder']});
  return gReq('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:'--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--'}).then(function(r){return r.json()}).then(function(j){g.fileId=j.id});
}
var driveDoc={set:function(o){return gWrite({v:1,ts:lts()||Date.now(),s:o.s})}};
function gConnect(){
  return gFind().then(function(id){
    if(!id){remoteDoc=driveDoc;return gWrite({v:1,ts:lts()||Date.now(),s:S})}
    return gRead().then(function(rem){
      if(rem&&rem.s&&Array.isArray(rem.s.assets)&&(rem.ts||0)>lts()){
        try{localStorage.setItem('kb-prev',JSON.stringify(S))}catch(e){}
        S=normalize(rem.s);ui.month=focusMonth();
        try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem('kb-ts',String(rem.ts||0))}catch(e){}
        remoteDoc=driveDoc;render();
      }else{remoteDoc=driveDoc;return gWrite({v:1,ts:lts()||Date.now(),s:S})}
    });
  });
}
function gToken(resp){
  if(!resp||resp.error){gSet('out',resp&&resp.error==='interaction_required'?'':'Sign-in did not complete.');return}
  g.token=resp.access_token;g.exp=Date.now()+(resp.expires_in||3600)*1000;
  try{localStorage.setItem('kb-g','1')}catch(e){}
  clearTimeout(g.timer);g.timer=setTimeout(function(){gSignIn('none')},Math.max(60000,(resp.expires_in||3600)*1000-300000));
  gSet('busy','Connecting to your Google Drive…');
  fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+g.token}}).then(function(r){return r.json()}).then(function(j){g.email=j.email||''},function(){})
    .then(gConnect).then(function(){setStatus('Saved to your Google Drive');gSet('in','')},function(e){remoteDoc=null;gSet('out','Could not reach Google Drive: '+e.message)});
}
function gInit(){
  if(!GID||!window.google||!google.accounts||!google.accounts.oauth2)return false;
  if(!g.client)g.client=google.accounts.oauth2.initTokenClient({client_id:GID,scope:GSCOPE,callback:gToken,error_callback:function(e){gSet('out',e&&e.type==='popup_closed'?'':'Sign-in did not complete.')}});
  return true;
}
function gSignIn(prompt){
  if(!gInit()){gSet(GID?'out':'off',GID?'Google sign-in is still loading. Try again in a moment.':'');return}
  if(prompt!=='none')gSet('busy','Opening Google sign-in…');
  g.client.requestAccessToken({prompt:prompt===undefined?'':prompt});
}
function gSignOut(){
  clearTimeout(g.timer);
  if(g.token&&window.google&&google.accounts&&google.accounts.oauth2){try{google.accounts.oauth2.revoke(g.token,function(){})}catch(e){}}
  g.token='';g.email='';g.fileId='';remoteDoc=null;
  try{localStorage.removeItem('kb-g')}catch(e){}
  setStatus('Saved in this browser only');
  gSet('out','Signed out. Your data stays on this device and in your Drive.');
}
function gDriveHint(){
  if(g.state==='loading'||g.state==='busy')return g.msg||'Checking Google sign-in availability…';
  if(g.state==='off')return g.msg||'Google sign-in is not set up for this site. Your data stays in this browser.';
  return g.msg||'Sign in to access your ledger on other devices.';
}
function gButton(){
  return '<button type="button" class="btn gbtn" data-act="g-in"'+(g.state==='out'?'':' disabled')+'>'+gIcon()+'Continue with Google</button>';
}
function driveCard(){
  var h='<div class="card"><h2>Google sign-in and Drive sync</h2><div style="margin-top:10px">';
  if(g.state==='in'){
    var exp=Date.now()>g.exp;
    h+='<p>Signed in'+(g.email?' as <b>'+esc(g.email)+'</b>':'')+'. Your data syncs to a private file in your own Google Drive. Only this app can open that file.</p>'+
      (exp?'<p class="warn sm" style="margin-top:6px">Sign-in timed out. Reconnect to keep saving to Drive.</p>':'')+
      '<div class="qa" style="margin-top:12px">'+(exp?'<button class="btn" data-act="g-in">Reconnect</button>':'')+'<button class="btn ghost" data-act="g-out">Sign out</button></div>';
  }else h+='<p class="muted sm" style="margin-bottom:10px" role="status">'+esc(gDriveHint())+'</p>'+gButton();
  return h+'</div></div>';
}
function gIcon(){return '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>'}
function driveSide(){
  if(g.state==='off'||g.state==='loading')return '';
  var rail=ui.collapsed;
  if(g.state==='in'){
    var em=g.email||'Google account', ini=(em[0]||'G').toUpperCase();
    return '<div class="uacct"><span class="av" aria-hidden="true" title="'+esc(em)+'">'+esc(ini)+'</span>'+(rail?'':'<span class="em"><b>Signed in</b><span>'+esc(em)+'</span></span>')+
      '<button type="button" class="toggle" data-act="g-out" aria-label="Sign out" title="Sign out">'+ic('logout')+'</button></div>';
  }
  if(g.state==='busy')return '<div class="uacct"><span class="muted sm">'+(rail?'…':'Connecting…')+'</span></div>';
  return '<div class="uacct">'+(rail?'<button type="button" class="btn gbtn rb" data-act="g-in" aria-label="Sign in with Google" title="Sign in with Google">'+gIcon()+'</button>':'<button type="button" class="btn gbtn" data-act="g-in">'+gIcon()+'Continue with Google</button>')+'</div>';
}

/* ---------- boot ---------- */
try{var sp0=localStorage.getItem('kb-side');ui.collapsed=sp0==null?window.innerWidth<=640:sp0==='1'}catch(e){ui.collapsed=window.innerWidth<=640}
try{var th0=localStorage.getItem('kb-theme');if(th0==='dark'||th0==='light'||th0==='heritage')document.documentElement.setAttribute('data-theme',th0);else document.documentElement.setAttribute('data-theme','light')}catch(e){document.documentElement.setAttribute('data-theme','light')}
var local=loadLocal();
loadedLocal=!!local;
S=normalize(local||examples());
ui.month=focusMonth();
route();

function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},ms)})])}
function initRemote(){
  if(!window.claude||!window.claude.use){setStatus('Saved in this browser only');return}
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0], user=r[1];
    if(!db||!user){setStatus('Saved in this browser only');return}
    return user.id().then(function(id){
      if(!id){setStatus('Saved in this browser only');return}
      var doc=db.doc('data/users/'+id+'/tracker');
      return withTimeout(doc.get(),10000).then(function(snap){
        remoteDoc=doc;
        if(snap.exists){
          var d=snap.data();
          if(d&&d.s&&Array.isArray(d.s.assets)){S=normalize(d.s);ui.month=focusMonth();render()}
          setStatus('Saved to your account');
        }else{
          setStatus('Saved to your account');
          if(loadedLocal)flush();
        }
      });
    });
  }).catch(function(){remoteDoc=null;setStatus('Saved in this browser only')});
}
setStatus('Saved in this browser only');
withTimeout(fetch('/google-config.json').then(function(res){
  if(!res.ok)throw new Error('Google configuration unavailable');
  return res.json();
}),5000).then(function(cfg){
  GID=cfg.clientId||'';
  gSet(GID?'out':'off','');
  if(!GID)return;
  var gtries=0;
  (function gw(){
    var flag='';try{flag=localStorage.getItem('kb-g')}catch(e){}
    if(window.google&&google.accounts&&google.accounts.oauth2){if(flag)gSignIn('none')}
    else if(gtries++<40)setTimeout(gw,250);
  })();
},function(){gSet('off','Google sign-in is unavailable right now. Your data stays in this browser.')});

})();
